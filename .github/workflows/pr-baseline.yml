# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: PR Baseline Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  baseline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node and pinned npm
        uses: ./.github/actions/setup-node-pinned-npm
        with:
          node-version: ${{ matrix.node-version }}

      - name: Validate runtime
        run: npm run env:check

      - name: Run lints
        run: npm run lint:all

      - name: Check IDE instruction mirrors
        run: npm run sync:ide-instructions -- --check

      - name: Verify registry package installs from lock
        run: |
          npm run build
          rm -rf .github/agents .cursor/skills .claude/agents .agents/skills
          npm run agents:ci
          drift_paths=(
            agents.json
            agents-lock.json
            .github/agents
            .cursor/skills
            .claude/agents
            .agents/skills
          )
          git diff --exit-code -- "${drift_paths[@]}"
          test -z "$(git status --porcelain -- "${drift_paths[@]}")"

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Secret scan
        run: npm run check:secrets
