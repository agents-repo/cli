# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: PR Baseline Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  changes:
    name: Path filters
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      slides: ${{ steps.match.outputs.slides }}
      node22: ${{ steps.match.outputs.node22 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Match changed paths
        id: match
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/ci-pr-path-filters.mjs

  baseline:
    name: baseline
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout webapp for docs sync
        uses: actions/checkout@v6
        with:
          repository: agents-repo/webapp
          path: .ci-webapp
          ref: main

      - name: Setup Node and pinned npm
        uses: ./.github/actions/setup-node-pinned-npm

      - name: Validate runtime
        run: npm run env:check

      - name: Run lints
        env:
          AGENTS_REPO_WEBAPP_ROOT: ${{ github.workspace }}/.ci-webapp
        run: npm run lint:all

      - name: Duplication check (jscpd)
        run: npm run dup:check

      - name: Check IDE instruction mirrors
        run: npm run sync:ide-instructions -- --check

      - name: Setup Chrome for Marp PDF
        if: needs.changes.outputs.slides == 'true'
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: setup-chrome

      - name: Check slide PDF drift
        if: needs.changes.outputs.slides == 'true'
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROME_NO_SANDBOX: '1'
        run: npm run slides:check

      - name: Skip slide PDF check
        if: needs.changes.outputs.slides != 'true'
        run: echo "Skipping slides:check; PR paths do not match the slides group (docs/slides/**, scripts/slides.mjs, npm lockfiles, .github/workflows/pr-baseline.yml, or scripts/ci-pr-path-filters.mjs)."

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Secret scan
        run: npm run check:secrets

  compat-node22:
    name: compat-node22
    needs: changes
    if: needs.changes.outputs.node22 == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout webapp for docs sync
        uses: actions/checkout@v6
        with:
          repository: agents-repo/webapp
          path: .ci-webapp
          ref: main

      - name: Setup Node 22 and pinned npm
        uses: ./.github/actions/setup-node-pinned-npm
        with:
          node-version: '22'

      - name: Validate runtime
        run: npm run env:check

      - name: Run lints
        env:
          AGENTS_REPO_WEBAPP_ROOT: ${{ github.workspace }}/.ci-webapp
        run: npm run lint:all

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Secret scan
        run: npm run check:secrets
