name: Copilot Environment Preflight

on:
  workflow_dispatch:
  workflow_call:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout webapp for docs sync
        uses: actions/checkout@v6
        with:
          repository: agents-repo/webapp
          path: .ci-webapp
          ref: main

      - name: Setup Node and pinned npm
        uses: ./.github/actions/setup-node-pinned-npm

      - name: Show runtime versions
        run: |
          node --version
          npm --version

      - name: Validate runtime
        run: npm run env:check

      - name: Run baseline lint checks
        env:
          AGENTS_REPO_WEBAPP_ROOT: ${{ github.workspace }}/.ci-webapp
        run: npm run lint:all

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test
