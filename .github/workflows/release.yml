name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run semantic-release in dry-run mode
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Release Inputs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node and pinned npm
        uses: ./.github/actions/setup-node-pinned-npm

      - name: Validate runtime
        run: npm run env:check

      - name: Run baseline checks
        run: npm run lint:all

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Secret scan
        run: npm run check:secrets

  release-dry-run:
    name: Release Dry Run
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - validate
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node and pinned npm
        uses: ./.github/actions/setup-node-pinned-npm

      - name: Build package
        run: npm run build

      - name: Run semantic-release dry run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: 0
        run: npm run release:dry-run

  release-publish:
    name: Publish Release
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs:
      - validate
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Validate release GitHub App client ID
        env:
          RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
        run: |
          if [ -z "${RELEASE_APP_CLIENT_ID}" ]; then
            echo "::error::Missing Actions variable RELEASE_APP_CLIENT_ID (GitHub App Client ID). See docs/npm-publishing.md#protected-main-and-release-automation."
            exit 1
          fi

      - name: Validate release App private key secret
        env:
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "${RELEASE_APP_PRIVATE_KEY}" ]; then
            echo "::error::Missing Actions secret RELEASE_APP_PRIVATE_KEY. See docs/npm-publishing.md#protected-main-and-release-automation."
            exit 1
          fi

      - name: Mint release GitHub App token
        id: release-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.release-app-token.outputs.token }}

      - name: Setup Node and pinned npm
        uses: ./.github/actions/setup-node-pinned-npm

      - name: Build package
        run: npm run build

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.release-app-token.outputs.token }}
          HUSKY: 0
        run: npm run release
